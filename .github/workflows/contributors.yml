---
name: "Contributors"

on:
  push:
    branches:
      - dev
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: "Update README contributors"
    runs-on: "ubuntu-latest"
    steps:
      - name: "✏️ Checkout code"
        uses: actions/checkout@v7

      - name: "👥 Regenerate the table"
        run: python3 .github/scripts/update_contributors.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop
      - name: "💾 Commit if changed"
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update contributors" README.md
          git push
