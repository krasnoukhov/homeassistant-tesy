name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@main"
      - name: Set up Python
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests

  card:
    name: Card Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@main"
      - name: Set up Node
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
      - name: Run card unit tests
        run: node --test tests/js/card.test.mjs

  black:
    name: Python Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@main"
      - name: Black Code Format Check
        uses: lgeiger/black-action@master
        with:
          args: ". --check --fast --diff"

  validate:
    name: Check hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@main"
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
